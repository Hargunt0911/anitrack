<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Masuk — AniTrack • SMKN 4 Malang</title>
    <link rel="icon" type="image/png" href="./logo-anitrack.png?v=20261124" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        cardHover: '0 8px 24px rgba(15, 23, 42, 0.07)',
                        blueGlow: '0 6px 16px rgba(0, 149, 255, 0.25)',
                    }
                }
            }
        }
    </script>
    <style>
        html, body { background-color: #F3F6FB; color: #1E293B; -webkit-tap-highlight-color: transparent; }
    </style>
</head>

<body class="bg-[#F3F6FB] text-[#1E293B] min-h-screen antialiased selection:bg-[#EAF4FF] selection:text-[#0095FF]">
    <section class="relative min-h-screen flex items-center justify-center p-4 overflow-hidden bg-[#F3F6FB]">
        <div class="pointer-events-none absolute -top-28 -left-28 w-80 h-80 rounded-full bg-[#F7C200]/25 blur-2xl"></div>
        <div class="pointer-events-none absolute -bottom-32 -right-24 w-96 h-96 rounded-full bg-[#4CB6A7]/25 blur-2xl"></div>
        <div class="pointer-events-none absolute top-1/3 right-12 w-36 h-36 rounded-full bg-[#0095FF]/12 blur-xl"></div>

        <button type="button" data-dark-toggle onclick="toggleDarkMode()" title="Ganti Mode Gelap / Terang"
            class="fixed top-4 right-4 z-20 w-10 h-10 rounded-xl bg-white border border-[#E8EEF6] shadow-cardHover flex items-center justify-center text-base cursor-pointer">
            <span data-dark-icon>🌙</span>
        </button>

        <div class="relative z-10 w-full max-w-[420px] mt-12">
            <!-- Mascot Logo Besar di Tengah Atas (Modern Floating Emblem) -->
            <div class="flex justify-center -mb-16 relative z-20">
                <div class="p-2 rounded-full bg-white shadow-[0_14px_34px_rgba(15,23,42,0.14)] ring-4 ring-white/80">
                    <img src="./logo-anitrack.png?v=20261124" alt="Logo AniTrack"
                        class="w-28 h-28 sm:w-32 sm:h-32 object-contain select-none drop-shadow-sm hover:scale-105 transition duration-300" />
                </div>
            </div>

            <div class="relative bg-white border border-[#E8EEF6] rounded-3xl shadow-[0_20px_50px_rgba(15,23,42,0.08)] pt-20 pb-7 px-7 sm:px-8 space-y-6">
                <div class="text-center space-y-1.5">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#EAF4FF] text-[#0082E6] text-[10.5px] font-extrabold uppercase tracking-wider">
                        SMKN 4 Malang • Animasi
                    </span>
                    <h1 class="text-2xl sm:text-[28px] font-extrabold tracking-tight text-[#1E293B]">AniTrack</h1>
                    <p class="text-xs sm:text-[13px] text-slate-500 leading-relaxed max-w-[310px] mx-auto">
                        Masuk dengan akun Anda untuk mengakses portal <strong>Siswa</strong>, <strong>Pembimbing</strong>, atau <strong>Admin</strong>.
                    </p>
                </div>

                <form id="loginForm" class="space-y-4">
                    <div>
                        <label for="loginUsername" class="block text-xs font-semibold text-slate-600 mb-1.5">
                            Username
                        </label>
                        <div class="relative flex items-center">
                            <svg class="w-4 h-4 text-slate-400 absolute left-3.5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                            <input id="loginUsername" type="text" required autocomplete="username" placeholder="contoh: afido"
                                class="w-full pl-10 pr-3.5 py-2.5 rounded-xl bg-[#F7F9FC] border border-[#E2E8F0] text-base sm:text-sm text-[#1E293B] placeholder:text-slate-400 focus:bg-white focus:outline-none focus:border-[#0095FF] focus:ring-4 focus:ring-[#0095FF]/10 transition" />
                        </div>
                    </div>

                    <div>
                        <label for="loginPassword" class="block text-xs font-semibold text-slate-600 mb-1.5">
                            Password
                        </label>
                        <div class="relative flex items-center">
                            <svg class="w-4 h-4 text-slate-400 absolute left-3.5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                            <input id="loginPassword" type="password" required autocomplete="current-password"
                                placeholder="Masukkan password"
                                class="w-full pl-10 pr-11 py-2.5 rounded-xl bg-[#F7F9FC] border border-[#E2E8F0] text-base sm:text-sm text-[#1E293B] placeholder:text-slate-400 focus:bg-white focus:outline-none focus:border-[#0095FF] focus:ring-4 focus:ring-[#0095FF]/10 transition" />
                            <button type="button" onclick="togglePass()" aria-label="Lihat password"
                                class="absolute right-3 text-slate-400 hover:text-[#1E293B] p-1 cursor-pointer">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button id="loginBtn" type="submit"
                        class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-[#0095FF] to-[#0077E6] hover:from-[#0082E6] hover:to-[#0066CC] active:scale-[0.99] text-white text-sm font-bold shadow-blueGlow transition cursor-pointer">
                        Masuk ke Dashboard →
                    </button>
                </form>

                <div id="loginError"
                    class="hidden text-xs font-medium text-[#E11D48] bg-[#FFF1F5] border border-[#FECDD6] rounded-xl px-3.5 py-2.5 text-center">
                </div>

                <div class="pt-2 border-t border-[#F1F5F9] text-center text-[11px] text-slate-400">
                    Sistem Monitoring Project &amp; Daily Task • Jurusan Animasi
                </div>
            </div>
        </div>
    </section>

    <script src="./anitrack-core.js?v=20261123c"></script>
    <script>
        (function () {
            const { supabase, getUser, setUser, redirectToRole, loadAdminRoleIds } = window.AniTrack;

            // Jika sudah login di sesi ini, langsung arahkan ke portal sesuai role
            const existing = getUser();
            if (existing && existing.id && existing.role) {
                redirectToRole(existing);
                return;
            }

            window.togglePass = function () {
                const inp = document.getElementById('loginPassword');
                if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
            };

            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const errEl = document.getElementById('loginError');
                const btn = document.getElementById('loginBtn');
                errEl.classList.add('hidden');

                const username = document.getElementById('loginUsername').value.trim().toLowerCase();
                const password = document.getElementById('loginPassword').value;

                btn.disabled = true;
                btn.textContent = 'Memeriksa akun...';

                const { data, error } = await supabase
                    .from('profiles')
                    .select('id, full_name, username, class_name, sub_concentration, role, mentor_id, avatar_url, whatsapp_number, project_drive_url')
                    .eq('username', username)
                    .eq('pin_or_password', password)
                    .maybeSingle();

                if (error || !data) {
                    btn.disabled = false;
                    btn.textContent = 'Masuk ke Dashboard';
                    errEl.textContent = error ? `Kendala koneksi: ${error.message}` : 'Username atau password tidak sesuai.';
                    errEl.classList.remove('hidden');
                    return;
                }

                const adminIds = await loadAdminRoleIds();
                data.is_operational_admin = data.role !== 'superadmin' && adminIds.includes(data.id);
                setUser(data);
                redirectToRole(data);
            });
        })();
    </script>
</body>

</html>
