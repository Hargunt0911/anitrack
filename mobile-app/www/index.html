<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AniTrack — SMKN 4 Malang</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #F3F6FB;
            color: #1E293B;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
        }
        .card {
            width: 100%;
            max-width: 360px;
            background: #FFFFFF;
            border: 1px solid #E8EEF6;
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        }
        h1 { margin: 0 0 8px; font-size: 20px; font-weight: 800; }
        p { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: #64748B; }
        button {
            width: 100%;
            min-height: 46px;
            border: 0;
            border-radius: 14px;
            background: #0095FF;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Koneksi Internet Diperlukan</h1>
        <p>Pastikan HP terhubung ke internet (Wi-Fi / data seluler) untuk memuat data live portal <strong>AniTrack SMKN 4 Malang</strong>.</p>
        <button type="button" onclick="window.location.href='https://anitrack.republikanimasi.my.id'">
            Muat Ulang AniTrack
        </button>
    </div>
</body>
</html>
