# Konfigurasi Nginx untuk AniTrack + Bot WA di Ubuntu Oracle Cloud
# Subdomain: https://anitrack.republikanimasi.my.id
# Simpan ke: /etc/nginx/sites-available/anitrack.republikanimasi.my.id
# Aktifkan:  sudo ln -sf /etc/nginx/sites-available/anitrack.republikanimasi.my.id /etc/nginx/sites-enabled/anitrack.republikanimasi.my.id
# SSL Gratis: sudo certbot --nginx -d anitrack.republikanimasi.my.id

server {
    listen 80;
    listen [::]:80;
    server_name anitrack.republikanimasi.my.id;

    # Folder tempat file web AniTrack (Index.html, siswa.html, pembimbing.html, admin.html, anitrack-core.js, logo-anitrack.png)
    root /var/www/anitrack;
    index Index.html index.html;

    # Redirect aman jika ada yang akses /index.html huruf kecil di Linux (case-sensitive)
    location = /index.html {
        return 301 /Index.html;
    }

    # Portal Web AniTrack
    location / {
        try_files $uri $uri/ /Index.html;
    }

    # Reverse Proxy ke Bot WA Node.js (Custom Webhook: https://anitrack.republikanimasi.my.id/wa-api/send)
    location /wa-api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Blokir akses langsung ke folder sensitif jika ada
    location ~ /\.(?!well-known) {
        deny all;
    }
}
